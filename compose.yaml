
services:
  frontend:
    build:
      context: ./client
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: mongodb://mongo:27017/myapp
      JWT_SECRET: super_secret_persistent_jwt_key_expense_tracker_2026
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:8000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
